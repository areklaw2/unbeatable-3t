document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ceholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;inset:-8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(239,236,226,.93);border-radius:20px;animation:pop .32s ease-out;\">\n              <div style=\"font-size:26px;font-weight:700;letter-spacing:-.5px;color:{{ resultColor }};text-align:center;\">{{ resultText }}<\u002Fdiv>\n              <button onclick=\"{{ rematch }}\" style=\"border:none;background:#1a1913;color:#efece2;font-family:inherit;font-size:13px;font-weight:600;border-radius:40px;padding:14px 30px;cursor:pointer;transition:all .14s;\" onfocus=\"{{ btnFocus }}\" onblur=\"{{ btnBlur }}\">Play again<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- scoreboard -->\n        <div style=\"display:flex;align-items:flex-start;justify-content:center;gap:26px;margin-top:40px;\">\n          <div style=\"text-align:center;\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#7fa8d9;white-space:nowrap;\">{{ labelX }}<\u002Fdiv>\n            <div style=\"font-size:36px;font-weight:700;margin-top:4px;color:#7fa8d9;\">{{ scoreX }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#8f8b7c;\">Tie<\u002Fdiv>\n            <div style=\"font-size:36px;font-weight:700;margin-top:4px;color:#8f8b7c;\">{{ scoreD }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.5px;color:#e08f8f;white-space:nowrap;\">{{ labelO }}<\u002Fdiv>\n            <div style=\"font-size:36px;font-weight:700;margin-top:4px;color:#e08f8f;\">{{ scoreO }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;\">\n            <div style=\"position:relative;width:16px;height:16px;\">\n              <div style=\"position:absolute;top:0;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#b7b3a6;\"><\u002Fdiv>\n              <div style=\"position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:12px;height:7px;border-radius:6px 6px 0 0;background:#b7b3a6;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;font-weight:600;color:#8f8b7c;\">{{ modeTag }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- controls -->\n        <div style=\"display:flex;justify-content:center;gap:14px;margin-top:32px;\">\n          <button onclick=\"{{ undo }}\" style=\"{{ undoStyle }}\" onfocus=\"{{ btnFocus }}\" onblur=\"{{ btnBlur }}\">Undo<\u002Fbutton>\n          <button onclick=\"{{ rematch }}\" style=\"border:1.5px solid #1a1913;background:transparent;color:#1a1913;font-family:inherit;font-size:13px;font-weight:600;border-radius:40px;padding:11px 24px;cursor:pointer;transition:all .14s;\" onfocus=\"{{ btnFocus }}\" onblur=\"{{ btnBlur }}\">New game<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot; },\n  &quot;xColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#7fa8d9&quot;, &quot;options&quot;: [&quot;#7fa8d9&quot;, &quot;#6fb7a6&quot;, &quot;#9a8fd4&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Player colors&quot; },\n  &quot;oColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#e08f8f&quot;, &quot;options&quot;: [&quot;#e08f8f&quot;, &quot;#e0a878&quot;, &quot;#d488b0&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Player colors&quot; },\n  &quot;firstMove&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Player&quot;, &quot;Computer&quot;], &quot;default&quot;: &quot;Player&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Rules&quot; },\n  &quot;showHints&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Rules&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'title',\n    mode: null,\n    difficulty: 'easy',\n    nameX: '',\n    nameO: '',\n    codeInput: '',\n    roomCode: '',\n    copied: false,\n    players: { X: 'PLAYER', O: 'COMPUTER' },\n    board: Array(9).fill(null),\n    turn: 'X',\n    winner: null,\n    winLine: null,\n    scores: { X: 0, O: 0, draw: 0 },\n    history: [],\n    thinking: false,\n  };\n\n  LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];\n\n  checkWinner(b) {\n    for (const [a,c,d] of this.LINES) {\n      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a,c,d] };\n    }\n    if (b.every(Boolean)) return { winner: 'draw', line: null };\n    return null;\n  }\n\n  minimax(b, player, ai, human) {\n    const res = this.checkWinner(b);\n    if (res) {\n      if (res.winner === ai) return { score: 10 };\n      if (res.winner === human) return { score: -10 };\n      return { score: 0 };\n    }\n    const moves = [];\n    for (let i = 0; i < 9; i++) {\n      if (!b[i]) {\n        b[i] = player;\n        const r = this.minimax(b, player === ai ? human : ai, ai, human);\n        moves.push({ idx: i, score: r.score });\n        b[i] = null;\n      }\n    }\n    if (player === ai) return moves.reduce((a,m) => m.score > a.score ? m : a, { score: -Infinity });\n    return moves.reduce((a,m) => m.score < a.score ? m : a, { score: Infinity });\n  }\n\n  aiPick(b, diff) {\n    const empty = b.map((v,i) => v ? -1 : i).filter(i => i >= 0);\n    if (diff === 'easy') return empty[Math.floor(Math.random() * empty.length)];\n    return this.minimax(b.slice(), 'O', 'O', 'X').idx;\n  }\n\n  place(idx) {\n    this.setState(s => {\n      if (s.winner || s.board[idx]) return null;\n      const board = s.board.slice();\n      board[idx] = s.turn;\n      const snapshot = { board: s.board.slice(), turn: s.turn, scores: { ...s.scores } };\n      const res = this.checkWinner(board);\n      let winner = null, winLine = null, scores = s.scores;\n      if (res) {\n        winner = res.winner; winLine = res.line;\n        scores = { ...s.scores };\n        if (res.winner === 'draw') scores.draw++; else scores[res.winner]++;\n      }\n      const nextTurn = s.turn === 'X' ? 'O' : 'X';\n      return {\n        board,\n        turn: winner ? s.turn : nextTurn,\n        winner, winLine, scores,\n        history: [...s.history, snapshot],\n      };\n    }, () => this.maybeCpu());\n  }\n\n  maybeCpu() {\n    const { mode, winner, turn } = this.state;\n    if (mode === 'single' && !winner && turn === 'O') {\n      this.setState({ thinking: true });\n      setTimeout(() => {\n        const idx = this.aiPick(this.state.board, this.state.difficulty);\n        this.setState({ thinking: false });\n        if (idx != null) this.place(idx);\n      }, 520);\n    }\n  }\n\n  handleCell(i) {\n    const { winner, board, mode, turn, thinking } = this.state;\n    if (winner || board[i] || thinking) return;\n    if (mode === 'single' && turn === 'O') return;\n    this.place(i);\n  }\n\n  undo() {\n    this.setState(s => {\n      if (!s.history.length || s.thinking) return null;\n      let h = s.history.slice();\n      let target = h.pop();\n      if (s.mode === 'single') {\n        while (h.length && target.turn !== 'X') target = h.pop();\n      }\n      return { board: target.board.slice(), turn: target.turn, scores: { ...target.scores }, winner: null, winLine: null, history: h };\n    });\n  }\n\n  rematch() {\n    const cpuFirst = this.state.mode === 'single' && this.props.firstMove === 'Computer';\n    this.setState({ board: Array(9).fill(null), turn: cpuFirst ? 'O' : 'X', winner: null, winLine: null, history: [], thinking: false }, () => this.maybeCpu());\n  }\n\n  genCode() {\n    const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';\n    let s = '';\n    for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)];\n    return s;\n  }\n\n  startGame(mode, players, roomCode) {\n    const cpuFirst = mode === 'single' && this.props.firstMove === 'Computer';\n    this.setState({ mode, players, roomCode: roomCode ?? this.state.roomCode, screen: 'game', board: Array(9).fill(null), turn: cpuFirst ? 'O' : 'X', winner: null, winLine: null, history: [], thinking: false, scores: { X: 0, O: 0, draw: 0 } }, () => this.maybeCpu());\n  }\n\n  renderVals() {\n    const s = this.state;\n    const XC = this.props.xColor ?? '#7fa8d9';\n    const OC = this.props.oColor ?? '#e08f8f';\n    const showHints = this.props.showHints ?? true;\n\n    const selBase = 'flex:1;font-family:inherit;font-size:14px;font-weight:600;border-radius:14px;padding:14px 4px;cursor:pointer;transition:all .12s;';\n    const easyStyle = selBase + (s.difficulty === 'easy'\n      ? 'background:#1a1913;color:#efece2;border:1.5px solid #1a1913;'\n      : 'background:transparent;color:#1a1913;border:1.5px solid #1a1913;');\n    const hardStyle = selBase + (s.difficulty === 'hard'\n      ? 'background:#1a1913;color:#efece2;border:1.5px solid #1a1913;'\n      : 'background:transparent;color:#1a1913;border:1.5px solid #1a1913;');\n\n    const gameOver = !!s.winner;\n    const cellBase = 'aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,13vw,58px);font-weight:700;border-radius:16px;user-select:none;transition:all .12s;';\n    const cells = s.board.map((m, i) => {\n      const isWin = s.winLine && s.winLine.includes(i);\n      const mc = m === 'X' ? XC : OC;\n      let bg = '#faf8f2', border = '1.5px solid #ded9cb', color = mc;\n      if (isWin) { bg = mc; border = '1.5px solid ' + mc; color = '#faf8f2'; }\n      else if (gameOver && m) { color = 'rgba(26,25,19,.18)'; }\n      const clickable = !m && !gameOver && !s.thinking && !(s.mode === 'single' && s.turn === 'O');\n      return {\n        mark: m || '',\n        style: cellBase + 'background:' + bg + ';border:' + border + ';color:' + color + ';cursor:' + (clickable ? 'pointer' : 'default') + ';',\n        hover: clickable ? 'background:#f3eee1 !important;border-color:#c9c3b2 !important;transform:scale(1.04)' : '',\n        onClick: () => this.handleCell(i),\n      };\n    });\n\n    let turnText = '', turnColor = s.turn === 'X' ? XC : OC;\n    if (!s.winner && showHints) {\n      if (s.mode === 'single' && s.turn === 'O') turnText = 'Computer is thinking…';\n      else if (s.mode === 'single') turnText = 'Your move';\n      else turnText = (s.players[s.turn] || '') + ' to move';\n    }\n\n    let resultText = '', resultColor = '#1a1913';\n    if (s.winner === 'draw') { resultText = 'Tie game'; resultColor = '#57544a'; }\n    else if (s.winner) {\n      resultColor = s.winner === 'X' ? XC : OC;\n      if (s.mode === 'single') resultText = s.winner === 'X' ? 'You win!' : 'Computer wins';\n      else resultText = (s.players[s.winner] || s.winner) + ' wins!';\n    }\n\n    const labelX = s.mode === 'single' ? 'Player · X' : (s.players.X + ' · X');\n    const labelO = s.mode === 'single' ? 'Computer · O' : (s.players.O + ' · O');\n    const link = 'unbeatable3t.gg/#' + (s.roomCode || 'XXXX');\n    const canUndo = s.history.length > 0 && !s.winner && !s.thinking;\n\n    return {\n      isTitle: s.screen === 'title',\n      isSpSetup: s.screen === 'spSetup',\n      isMpChoose: s.screen === 'mpChoose',\n      isMpCreate: s.screen === 'mpCreate',\n      isMpJoin: s.screen === 'mpJoin',\n      isGame: s.screen === 'game',\n\n      nameX: s.nameX, nameO: s.nameO, codeInput: s.codeInput,\n      roomChars: (s.roomCode || 'XXXX').split(''),\n      link,\n      copyLabel: s.copied ? 'Copied' : 'Copy',\n      copyBg: s.copied ? '#7fa8d9' : '#1a1913',\n      copyColor: '#efece2',\n      easyStyle, hardStyle,\n\n      cells,\n      showTurn: !s.winner && showHints,\n      turnText, turnColor,\n      hasWinner: gameOver,\n      resultText, resultColor,\n      labelX, labelO,\n      scoreX: s.scores.X, scoreO: s.scores.O, scoreD: s.scores.draw,\n      modeTag: s.mode === 'single' ? '1P' : '2P',\n      undoStyle: 'font-family:inherit;font-size:13px;font-weight:600;border-radius:40px;padding:11px 24px;cursor:' + (canUndo ? 'pointer' : 'default') + ';transition:all .14s;background:transparent;border:1.5px solid ' + (canUndo ? '#1a1913' : '#ded9cb') + ';color:' + (canUndo ? '#1a1913' : '#c4c0b2') + ';',\n      undoHover: canUndo ? 'background:#1a1913 !important;color:#efece2 !important;transform:translateY(-2px);box-shadow:0 6px 16px rgba(26,25,19,.26)' : '',\n\n      onFocusInput: (e) => { e.currentTarget.style.borderColor = '#1a1913'; e.currentTarget.style.background = '#fff'; },\n      onBlurInput: (e) => { e.currentTarget.style.borderColor = '#ded9cb'; e.currentTarget.style.background = '#faf8f2'; },\n      btnFocus: (e) => { e.currentTarget.style.outline = '2px solid #1a1913'; e.currentTarget.style.outlineOffset = '2px'; },\n      btnBlur: (e) => { e.currentTarget.style.outline = 'none'; },\n      goSingle: () => this.setState({ screen: 'spSetup' }),\n      goMulti: () => this.setState({ screen: 'mpChoose' }),\n      backTitle: () => this.setState({ screen: 'title' }),\n      gotoMpChoose: () => this.setState({ screen: 'mpChoose' }),\n      gotoCreate: () => this.setState({ screen: 'mpCreate', roomCode: this.state.roomCode || this.genCode(), copied: false }),\n      gotoJoin: () => this.setState({ screen: 'mpJoin' }),\n      onNameX: (e) => this.setState({ nameX: e.target.value }),\n      onNameO: (e) => this.setState({ nameO: e.target.value }),\n      onCode: (e) => this.setState({ codeInput: e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4) }),\n      setEasy: () => this.setState({ difficulty: 'easy' }),\n      setHard: () => this.setState({ difficulty: 'hard' }),\n      startSingle: () => this.startGame('single', { X: (this.state.nameX || 'PLAYER').toUpperCase(), O: 'COMPUTER' }),\n      startCreated: () => this.startGame('local', { X: (this.state.nameX || 'PLAYER 1').toUpperCase(), O: 'PLAYER 2' }),\n      startJoined: () => this.startGame('local', { X: 'PLAYER 1', O: (this.state.nameO || 'PLAYER 2').toUpperCase() }, this.state.codeInput || this.genCode()),\n      copyLink: () => { try { navigator.clipboard && navigator.clipboard.writeText(link); } catch (e) {} this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1400); },\n      undo: () => this.undo(),\n      rematch: () => this.rematch(),\n      quit: () => this.setState({ screen: 'title' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
