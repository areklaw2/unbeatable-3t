[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
api = { workspace = true }

# remove this once game state is refactored
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "api/server"]
