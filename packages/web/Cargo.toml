[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { workspace = true }
dioxus = { workspace = true, features = ["router", "fullstack"] }
serde = {workspace = true }
gloo-storage = "0.4.0"

dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# remove this once game state is refactored

[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = ["dioxus/server", "api/server"]
